name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write  # for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          # When pending changesets exist, opens/updates a "Version Packages"
          # PR with bumped package.json + CHANGELOG.md.
          version: npm run version
          # When the "Version Packages" PR merges (no pending changesets,
          # version differs from npm), publishes to npm.
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
